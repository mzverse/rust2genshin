name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: rustup +nightly component add rustc-dev rust-src llvm-tools-preview
    - name: Build
      run: cargo +nightly run -p build-demo
