[workspace]
members = [
    "core",
    "lib",
    "lib-internal",
    "demo",
    "build-demo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["lyt", "mz"]
rust-version = "1.100.0"

[workspace.dependencies]
rust2genshin-lib = { path = "lib" }
enum_dispatch = "0"
downcast = "0"
anyhow = "1"
slotmap = "1"

[workspace.lints.rust]
