[workspace]
members = [
    "docs",
    "core",
    "build-demo",
    "lib",
    "lib-internal",
    "demo",
    "viewer",
    "playground",
]
# `viewer` 依赖 gpui,gpui 在 Linux 上要 X11/Wayland/字体等系统库,
# 而 CI(`build.yml`)只装了 protobuf-compiler。把它排除出默认成员,
# 不带 `-p` 的 `cargo build` / `cargo test` 就不会去编译它。
# 当前 CI 只跑 `cargo run -p build-demo`(每次调用都带显式 `-p`),本来就绕开了;
# 这一行是防将来 CI 改成 `cargo build` 或 `cargo test --workspace`。
# 需要构建 viewer 时显式:`cargo build -p rust2genshin-viewer`。
default-members = [
    "core",
    "build-demo",
    "lib",
    "lib-internal",
    "demo",
]
# playground 是独立 web 服务(依赖 axum/tokio),不进 default-members:
# 根目录的 `cargo build` / `cargo test` 不该去编它。
# 需要时显式:`cargo build -p rust2genshin-playground`。
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["lyt", "mz"]

[workspace.dependencies]
rust2genshin-lib = { path = "lib" }
downcast = "0"
tap = "1"
either = "1"
serde = "1"
typetag = "0"

[workspace.lints.rust]

[profile.release]
opt-level = 3
overflow-checks = false
